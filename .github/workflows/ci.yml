name: ci
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: install uv
        uses: astral-sh/setup-uv@v7

      - name: install dependencies
        run: uv sync --locked --all-groups

      - name: check formatting
        run: uv run ruff format --check .

      - name: run linting
        run: uv run ruff check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: install uv
        uses: astral-sh/setup-uv@v7

      - name: install dependencies
        run: uv sync --locked --all-groups

      - name: run mypy
        run: uv run mypy --no-incremental

  test:
    name: test
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payments
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d payments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/payments
    steps:
      - uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: install uv
        uses: astral-sh/setup-uv@v7

      - name: install dependencies
        run: uv sync --locked --all-groups

      - name: run tests
        run: uv run pytest tests --verbose
