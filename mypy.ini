[mypy]
python_version = 3.14
strict = True
files = payflow, tests, alembic
namespace_packages = True
explicit_package_bases = True
plugins = pydantic.mypy
platform = linux

pretty = True
show_error_codes = True
show_column_numbers = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True
strict_equality = True
extra_checks = True

enable_error_code = explicit-override, possibly-undefined, redundant-expr, truthy-bool, truthy-iterable, ignore-without-code, unused-awaitable, mutable-override

check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
disallow_any_unimported = True
no_implicit_optional = True

disallow_untyped_calls = False

exclude = ^(\.venv|\.ruff_cache|\.mypy_cache)/

# Внутренние слои без единого явного Any
[mypy-payflow.domain.*]
disallow_any_explicit = True

[mypy-payflow.application.*]
disallow_any_explicit = True

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
