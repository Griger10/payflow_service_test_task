[project]
name = "payflow"
version = "0.1.0"
description = "Layered asynchronous payment processing service"
requires-python = ">=3.14"
dependencies = [
    "alembic~=1.20.0",
    "asyncpg~=0.31.0",
    "fastapi~=0.142.0",
    "faststream[rabbit]~=0.7.7",
    "httpx~=0.28.1",
    "pydantic~=2.13.5",
    "pydantic-settings~=2.15.0",
    "sqlalchemy[asyncio]~=2.1.1",
    "uvicorn[standard]~=0.54.0",
]

[dependency-groups]
dev = [
    "mypy~=2.3.1",
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "ruff~=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["payflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "PL", "ANN401", "PGH003"]
ignore = ["PLR0913"]
